<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <pattern id="comicDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.4)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />
  <rect width="800" height="600" fill="url(#comicDots)" />

  <!-- Comic Outer Frame -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#f59e0b" stroke-width="6" rx="8" />
  <rect x="26" y="26" width="748" height="548" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" rx="4" />

  <!-- Center Card -->
  <g transform="translate(400, 260)">
    <!-- Icon Circle -->
    <circle cx="0" cy="0" r="60" fill="#4f46e5" filter="url(#shadow)" stroke="#f59e0b" stroke-width="3" />
    
    <!-- Magic Wand / Palette Icon -->
    <path d="M-20,15 L15,-20 L25,-10 L-10,25 Z" fill="#fbbf24" />
    <path d="M15,-20 L20,-25 L25,-20 L20,-15 Z" fill="#fef08a" />
    <!-- Sparkles -->
    <path d="M-25,-25 L-20,-15 L-15,-25 L-25,-25 Z" fill="#ffffff" />
    <circle cx="25" cy="20" r="3" fill="#ffffff" />
    <circle cx="-25" cy="15" r="2.5" fill="#fde68a" />
    <circle cx="20" cy="-30" r="3" fill="#fde68a" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 360)">
    <rect x="-140" y="0" width="280" height="38" rx="19" fill="#f59e0b" filter="url(#shadow)" />
    <text x="0" y="25" fill="#1e1b4b" font-family="'Impact', 'Segoe UI', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">COMICCRAFT PANEL</text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="430" fill="#e0e7ff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">AI Illustrated Comic Scene</text>
  <text x="400" y="456" fill="#a5b4fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Click regenerate to create a new illustration</text>
</svg>
